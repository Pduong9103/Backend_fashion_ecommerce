version: '3.8'

networks:
  fashion_network:
    driver: bridge

services:
  # Container 1: Database PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: fashion_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-090103}
      POSTGRES_DB: ${DB_NAME:-fashion_ecommerce}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fashion_network

  # Container 2: Redis Memory Cache & Lock
  redis:
    image: redis:7-alpine
    container_name: fashion_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fashion_network

  # Container 3: RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fashion_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fashion_network

  # Container 4: WMS Inventory Microservice
  wms_service:
    build:
      context: ./wms-service
      dockerfile: Dockerfile
    container_name: fashion_wms_service
    restart: always
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-090103}@postgres_db:5432/${DB_NAME:-fashion_ecommerce}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    volumes:
      - ./wms-service:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "5001:5001"
    depends_on:
      - postgres_db
      - redis
      - rabbitmq
    networks:
      - fashion_network

  # Container 5: Database Admin UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fashion_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db
    networks:
      - fashion_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
